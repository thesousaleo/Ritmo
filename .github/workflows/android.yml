name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    # 24.04 já traz o Android SDK instalado (ANDROID_HOME)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Conferir Android SDK
        run: |
          echo "::notice title=Android SDK::ANDROID_HOME=$ANDROID_HOME platforms=$(ls "$ANDROID_HOME/platforms" 2>/dev/null | tr '\n' ' ') build-tools=$(ls "$ANDROID_HOME/build-tools" 2>/dev/null | tr '\n' ' ')"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Instalar dependências
        run: ci/run.sh "npm install" npm install --no-audit --no-fund

      - name: Testes
        run: ci/run.sh "Testes" npm test

      - name: Build do app web
        run: ci/run.sh "Build web" npm run build
        env:
          VITE_BASE: ./

      - name: Criar projeto Android
        run: ci/run.sh "cap add" npx cap add android

      - name: Ícones do app
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ECEFE9' --iconBackgroundColorDark '#0F1412'

      - name: Sincronizar Capacitor
        run: ci/run.sh "cap sync" npx cap sync android

      - name: Versão do APK
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # Mesma chave em todo build: o Android aceita instalar a versão nova por cima da antiga
      - name: Chave de assinatura fixa
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ../ci/run.sh "Gradle" ./gradlew assembleDebug --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ritmo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ritmo-apk
          path: ritmo.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ritmo 1.0.${{ github.run_number }}
          make_latest: true
          files: ritmo.apk
          body: |
            APK do Ritmo gerado a partir de ${{ github.sha }}.

            Para instalar: baixe `ritmo.apk` no celular Android, abra o arquivo e permita a instalação de apps desta fonte quando o Android pedir. Versões novas instalam por cima e mantêm seus dados.
